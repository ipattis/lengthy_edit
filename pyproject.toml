[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lengthy-edit"
version = "0.1.0"
description = "Local UI + toolkit for producing song-length AI music films: Claude for research/lyrics/storyboard/prompts/sound, Suno for the song, Midjourney for stills and loops, Seedance (via Higgsfield) for motion, ffmpeg for the cut."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lengthy-edit = "lengthy_edit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lengthy_edit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
